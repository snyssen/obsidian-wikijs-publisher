# Throwaway Wiki.js instances for development (v2 and v3). Use the `wiki-*` just recipes to manage them.
services:
  db-v2:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: wikijsrocks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db-v2-data:/var/lib/postgresql

  wiki-v2:
    image: ghcr.io/requarks/wiki:2.5.317@sha256:e4708eed80c014449c0c8426c8d466c7a52a62131555bb44372fa48378b448b8
    depends_on:
      db-v2:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db-v2
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
    ports:
      - "${WIKI_V2_PORT:-3080}:3000"

  db-v3:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: wikijsrocks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db-v3-data:/var/lib/postgresql

  wiki-v3:
    image: ghcr.io/requarks/wiki:3.1.1@sha256:cd2c88eecc17362a7a8ab81c3ec9bdb4300925bfc74e1f87dc9d393a654e5944
    depends_on:
      db-v3:
        condition: service_healthy
    environment:
      DB_HOST: db-v3
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
      # First admin account, only used when the database is created
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASS: admin12345
    ports:
      - "${WIKI_V3_PORT:-3081}:3000"

volumes:
  db-v2-data:
  db-v3-data:
